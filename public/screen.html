<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Award Bedeez — Écran</title>
  <meta name="theme-color" content="#1683F3"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <main class="app">
    <div class="screen-grid">
      <section>
        <div class="brand">
          <div class="brand-mark">★</div>
          <div class="brand-text"><strong>Award Bedeez</strong><span>Live</span></div>
        </div>
        <h1 class="hero-title">Award <span class="accent">Bedeez</span></h1>
        <p class="subtitle">Scanne le QR code, vote depuis ton téléphone et regarde la jauge grimper en direct !</p>

        <div style="margin-top:34px">
          <div class="progress-label">
            <div>
              <div class="small">Votes</div>
              <div id="votes" class="big-number">0</div>
            </div>
            <div style="text-align:right">
              <div class="small">Objectif</div>
              <div id="goal" style="font-size:1.7rem;font-weight:1000;color:var(--orange)">100</div>
            </div>
          </div>
          <div class="progress-shell"><div id="bar" class="progress-bar"></div></div>
        </div>
      </section>

      <section class="card screen-right">
        <div class="mascot-wrap">
          <img id="mascot" class="mascot" src="/mascotte-bedeez.png" alt="Mascotte Bedeez"/>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:10px">
          <img class="qr" src="/qr" alt="QR code pour voter"/>
          <div>
            <div style="font-weight:1000;font-size:1.4rem;color:var(--blue)">À toi de jouer !</div>
            <div class="small" style="max-width:200px;margin-top:6px">Scanne et appuie sur le bouton pour soutenir l’Award Bedeez.</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const votesEl = document.getElementById("votes");
    const goalEl = document.getElementById("goal");
    const bar = document.getElementById("bar");
    const mascot = document.getElementById("mascot");

    socket.on("state", ({votes, goal}) => {
      votesEl.textContent = votes;
      goalEl.textContent = goal;
      const pct = Math.max(0, Math.min(100, (votes/goal)*100));
      bar.style.width = pct + "%";
    });

    socket.on("celebrate", () => {
      mascot.classList.remove("bounce");
      void mascot.offsetWidth;
      mascot.classList.add("bounce");
      confetti();
    });

    function confetti(){
      const colors = ["#1683F3","#FFA400","#FFBE42","#79C3FF"];
      for(let i=0;i<18;i++){
        const d = document.createElement("div");
        d.className = "confetti-dot";
        d.style.left = (50 + Math.random()*18 - 9) + "vw";
        d.style.top = (47 + Math.random()*8 - 4) + "vh";
        d.style.background = colors[Math.floor(Math.random()*colors.length)];
        d.style.setProperty("--x", (Math.random()*460-230)+"px");
        d.style.setProperty("--y", (Math.random()*380-80)+"px");
        document.body.appendChild(d);
        setTimeout(()=>d.remove(),1350);
      }
    }
  </script>
</body>
</html>
