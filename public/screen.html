<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Award Bedeez — Écran</title>
  <meta name="theme-color" content="#1683F3"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <main class="app">
    <div class="screen-grid">
      <section>
        <div class="brand">
          <div class="brand-mark">★</div>
          <div class="brand-text"><strong>Award Bedeez</strong><span>Live</span></div>
        </div>

        <h1 id="liveTitle" class="hero-title">Award Bedeez</h1>
        <p id="liveSubtitle" class="subtitle">Scanne le QR code, vote depuis ton téléphone et regarde la jauge grimper en direct !</p>
        <div id="specialMessage" class="special-message"></div>

        <div id="progressBlock" style="margin-top:34px">
          <div class="progress-label">
            <div>
              <div class="small">Votes</div>
              <div id="votes" class="big-number">0</div>
            </div>
            <div style="text-align:right">
              <div class="small">Objectif</div>
              <div id="goal" style="font-size:1.7rem;font-weight:1000;color:var(--orange)">100</div>
            </div>
          </div>
          <div class="progress-shell"><div id="bar" class="progress-bar"></div></div>
        </div>
      </section>

      <section class="card screen-right">
        <div id="mascotWrap" class="mascot-wrap">
          <img id="mascot" class="mascot" src="/mascotte-bedeez.png" alt="Mascotte Bedeez"/>
        </div>

        <div id="qrBlock" style="display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:16px">
          <img class="qr" src="/qr" alt="QR code pour voter"/>
          <div>
            <div style="font-weight:1000;font-size:1.4rem;color:var(--blue)">À toi de jouer !</div>
            <div class="small" style="max-width:200px;margin-top:6px">Scanne et vote depuis ton téléphone.</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="winnerOverlay" class="winner-overlay">
    <div class="winner-trophy">🏆</div>
    <div id="winnerTitle" class="winner-title">Award Bedeez</div>
    <div class="winner-sub">WINNER !</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const votesEl = document.getElementById("votes");
    const goalEl = document.getElementById("goal");
    const bar = document.getElementById("bar");
    const mascot = document.getElementById("mascot");
    const mascotWrap = document.getElementById("mascotWrap");
    const titleEl = document.getElementById("liveTitle");
    const subtitleEl = document.getElementById("liveSubtitle");
    const specialEl = document.getElementById("specialMessage");
    const qrBlock = document.getElementById("qrBlock");
    const progressBlock = document.getElementById("progressBlock");
    const winnerOverlay = document.getElementById("winnerOverlay");
    const winnerTitle = document.getElementById("winnerTitle");

    socket.on("state", ({votes, goal, liveText, ui}) => {
      votesEl.textContent = votes;
      goalEl.textContent = goal;
      bar.style.width = Math.max(0, Math.min(100, (votes/goal)*100)) + "%";

      if (liveText) {
        titleEl.textContent = liveText.title;
        subtitleEl.textContent = liveText.screenSubtitle;
        winnerTitle.textContent = liveText.title || "Award Bedeez";
        specialEl.textContent = liveText.specialMessage || "";
        specialEl.classList.toggle("show", Boolean(liveText.specialMessage));
      }

      if (ui) {
        titleEl.style.color = ui.titleColor;
        titleEl.style.fontSize = ui.titleSize + "px";
        subtitleEl.style.color = ui.subtitleColor;
        subtitleEl.style.fontSize = ui.subtitleSize + "px";
        qrBlock.classList.toggle("hidden", !ui.qrVisible);
        mascotWrap.classList.toggle("hidden", !ui.mascotVisible);
        progressBlock.classList.toggle("hidden", !ui.progressVisible);
      }
    });

    socket.on("celebrate", () => {
      mascot.classList.remove("bounce");
      void mascot.offsetWidth;
      mascot.classList.add("bounce");
      confetti(20);
    });

    socket.on("winner", () => {
      winnerOverlay.classList.add("show");
      confetti(140);
      setTimeout(() => winnerOverlay.classList.remove("show"), 7000);
    });

    function confetti(count){
      const colors = ["#1683F3","#FFA400","#FFBE42","#79C3FF","#FFFFFF"];
      for(let i=0;i<count;i++){
        const d = document.createElement("div");
        d.className = "confetti-dot";
        d.style.left = (Math.random()*100) + "vw";
        d.style.top = "-20px";
        d.style.background = colors[Math.floor(Math.random()*colors.length)];
        d.style.setProperty("--x", (Math.random()*520-260)+"px");
        d.style.setProperty("--y", (window.innerHeight + Math.random()*400)+"px");
        document.body.appendChild(d);
        setTimeout(()=>d.remove(),1800);
      }
    }
  </script>
</body>
</html>
